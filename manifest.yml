modules:
  jira:issueContext:
    - key: precedent-issue-context
      resource: main
      resolver:
        function: resolver
      render: native
      title: Precedent
      label: Precedent
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  jira:adminPage:
    - key: precedent-admin
      resource: admin
      resolver:
        function: resolver
      render: native
      title: Precedent
  trigger:
    - key: precedent-check-trigger
      function: check-trigger
      events:
        - avi:jira:created:issue
        - avi:jira:updated:issue
      filter:
        ignoreSelf: true
  llm:
    - key: precedent-llm
      model:
        - claude
  function:
    - key: resolver
      handler: index.handler
    - key: check-trigger
      handler: index.onIssueEvent
resources:
  - key: main
    path: src/frontend/index.tsx
  - key: admin
    path: src/frontend/admin.tsx
permissions:
  scopes:
    # Jira: read/create sample project and issues
    - read:jira-user
    - read:jira-work
    - write:jira-work
    - manage:jira-project
    - manage:jira-configuration
    # Confluence: sample space, Decision pages, labels, marker properties
    - read:space:confluence
    - write:space:confluence
    - read:space.property:confluence
    - write:space.property:confluence
    - read:page:confluence
    - write:page:confluence
    - write:confluence-content
    - write:confluence-space
    # Checking: search and read Decision pages as the app
    - search:confluence
    - read:confluence-content.all
    # Settings (Decision Spaces)
    - storage:app
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/3fb3cd0d-3fb4-4fd2-bd56-bbe0cf1beda6
